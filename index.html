  <style>
    :root { color-scheme: light; --wine:#53111f; --wine-deep:#3c0b17; --gold:#c6a15a; --paper:#f7f2e8; }

    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at top,#6a1b2b,var(--wine-deep) 65%); color:#fff9ed; font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100%,390px); padding:32px 24px; border:1px solid rgba(198,161,90,.65); border-radius:24px; background:rgba(255,253,248,.98); color:#2d2422; text-align:center; box-shadow:0 24px 70px rgba(0,0,0,.28); }
    img { width:108px; height:108px; object-fit:cover; border-radius:50%; border:3px solid var(--gold); box-shadow:0 0 0 7px rgba(198,161,90,.15); }
    h1 { margin:22px 0 8px; color:var(--wine); font:500 29px Georgia,"Times New Roman",serif; }
    p { margin:0 0 24px; color:#786d63; line-height:1.5; }
    a { display:block; padding:15px 18px; border-radius:14px; background:linear-gradient(120deg,var(--wine),var(--wine-deep)); color:#fff9ed; font-weight:700; text-decoration:none; }
    .note { margin:16px 0 0; font-size:12px; }
  </style>
